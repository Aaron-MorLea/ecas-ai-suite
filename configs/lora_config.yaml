# LoRA Fine-tuning Configuration (Covers: Fine-tuning, LoRA, P-tuning)
model:
  name: "meta-llama/Meta-Llama-3.1-8B"
  max_seq_length: 2048
  load_in_4bit: false  # Set true for QLoRA

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  learning_rate: 3e-4
  lr_scheduler_type: "linear"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  fp16: true
  bf16: false
  logging_steps: 1
  optim: "adamw_8bit"
  weight_decay: 0.01
  warmup_steps: 10
  output_dir: "./models/lora_output"
  report_to: "mlflow"

p_tuning:
  num_virtual_tokens: 20
  prompt_tuning_init: "TEXT"
  prompt_tuning_init_text: "Classify the following e-commerce query:"
