[tool.poetry]
name = "ecas-ai-suite"
version = "0.1.0"
description = "E-Commerce AI Suite: Open-source platform for intelligent e-commerce automation"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.1.0"
tensorflow = "^2.15.0"
transformers = "^4.36.0"
unsloth = "^2024.2"
trl = "^0.7.4"
langchain = "^0.1.0"
langgraph = "^0.0.30"
chromadb = "^0.4.0"
neo4j = "^5.14.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.5.0"
vllm = "^0.3.0"
sglang = "^0.1.0"
mlflow = "^2.9.0"
dvc = "^3.0.0"
evidently = "^0.4.0"
stable-diffusion = "^1.0.0"
pandas = "^2.1.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"
datasets = "^2.16.0"
accelerate = "^0.25.0"
peft = "^0.7.0"
bitsandbytes = "^0.41.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
ruff = "^0.1.0"
